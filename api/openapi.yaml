  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          enum:
          - about:blank
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Standard HTTP reason phrase for status.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 500
          description: Safe explanation; no SQL, tokens, or inaccessible record details.
        code:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[a-z][a-z0-9_]*$
        request_id:
          type: string
          format: uuid
        errors:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
                minLength: 1
                maxLength: 100
              code:
                type: string
                minLength: 1
                maxLength: 80
              message:
                type: string
                minLength: 1
                maxLength: 200
            required:
            - field
            - code
            - message
      required:
      - type
      - title
      - status
      - detail
      - code
      - request_id
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          format: email
          description: Trim and normalize to lowercase under the MVP email policy.
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
          writeOnly: true
      required:
      - email
      - password
    Session:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          minLength: 1
          maxLength: 512
          description: Opaque random bearer token; store only in browser memory.
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          enum:
          - 3600
        user:
