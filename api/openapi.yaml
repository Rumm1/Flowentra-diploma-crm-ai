openapi: 3.1.0
info:
  title: Business CRM + AI Assistant — Draft API Contract
  version: 0.1.0-draft
  description: >-
    Diploma-project API design ONLY. No backend endpoints are claimed to be
    implemented. Mutating AI proposals require explicit confirmation and
    revalidation. UUIDs and role policies are design assumptions for review.
servers:
  - url: http://localhost:8080/api/v1
    description: Proposed local backend address (not running)
security:
  - cookieAuth: []
tags:
  - name: Authentication
  - name: Clients
  - name: Deals
  - name: Tasks
  - name: Bookings
  - name: AI
  - name: Reports
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in staff member
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 8}
      responses:
        '200': {description: Authenticated session cookie plus minimal current user, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentUser'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      tags: [Authentication]
      summary: End current session
      responses:
        '204': {description: Session invalidated}
  /clients:
    get:
      tags: [Clients]
      summary: List authorized clients
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 25, minimum: 1, maximum: 100}}
      responses:
        '200': {description: List, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Client'}}}}}
    post:
      tags: [Clients]
      summary: Create client after server-side authorization and validation
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ClientInput'}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /clients/{id}:
    get:
      tags: [Clients]
      summary: Get authorized client
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: Client, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Clients]
      summary: Modify authorized client
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ClientInput'}}
      responses:
        '200': {description: Updated client, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /deals:
    get:
      tags: [Deals]
      summary: List authorized deals
      responses:
        '200': {description: Deal array, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Deal'}}}}}
    post:
      tags: [Deals]
      summary: Create deal associated with an existing client
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/DealInput'}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Deal'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /deals/{id}:
    patch:
      tags: [Deals]
      summary: Update deal including pipeline stage
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/DealInput'}}
      responses:
        '200': {description: Updated}
        '403': {$ref: '#/components/responses/Forbidden'}
  /tasks:
    get:
      tags: [Tasks]
      summary: List assigned or authorized tasks
      responses:
        '200': {description: Task array, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Task'}}}}}
    post:
      tags: [Tasks]
      summary: Create assigned task
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/TaskInput'}}
      responses:
        '201': {description: Created}
        '403': {$ref: '#/components/responses/Forbidden'}
  /tasks/{id}:
    patch:
      tags: [Tasks]
      summary: Update own/authorized task
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/TaskInput'}}
      responses:
        '200': {description: Updated}
        '403': {$ref: '#/components/responses/Forbidden'}
  /bookings:
    get:
      tags: [Bookings]
      summary: List authorized confirmed/cancelled bookings
      responses:
        '200': {description: Booking array, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Booking'}}}}}
    post:
      tags: [Bookings]
      summary: Create booking with atomic resource-overlap protection
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 100}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/BookingInput'}}
      responses:
        '201': {description: Booking confirmed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /bookings/{id}:
    patch:
      tags: [Bookings]
      summary: Reschedule or cancel; overlap rule reapplied inside transaction
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/BookingInput'}}
      responses:
        '200': {description: Booking updated}
        '409': {$ref: '#/components/responses/Conflict'}
  /reports/overview:
    get:
      tags: [Reports]
      summary: Aggregated counts for authorized scope
      responses:
        '200': {description: Overview metrics, content: {application/json: {schema: {type: object, properties: {clients: {type: integer}, activeDeals: {type: integer}, openTasks: {type: integer}, confirmedBookings: {type: integer}}}}}}
  /ai/proposals:
    post:
      tags: [AI]
      summary: Prepare typed proposed action; must not change business records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, minLength: 3, maxLength: 1000}
      responses:
        '201': {description: Proposal awaiting human review, content: {application/json: {schema: {$ref: '#/components/schemas/AIProposal'}}}}
        '422': {$ref: '#/components/responses/BadRequest'}
        '503': {description: Model unavailable; no data mutation}
  /ai/proposals/{id}/confirm:
    post:
      tags: [AI]
      summary: Confirm exact proposed action after renewed role, schema and state checks
      parameters:
        - {$ref: '#/components/parameters/id'}
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 100}}
      responses:
        '200': {description: Allowed action completed exactly once; returns execution result}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {description: Proposal expired; no action}
  /ai/proposals/{id}/reject:
    post:
      tags: [AI]
      summary: Reject proposal without executing it
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '204': {description: Proposal rejected without business data mutation}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: crm_session
      description: Draft secure HttpOnly cookie design; CSRF controls must be finalized.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    CurrentUser:
      type: object
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [ADMIN, MANAGER, EMPLOYEE]}
        displayName: {type: string}
    ClientInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        company: {type: string, maxLength: 160}
        email: {type: string, format: email}
        phone: {type: string, maxLength: 40}
        notes: {type: string, maxLength: 2000}
    Client:
      allOf:
        - {$ref: '#/components/schemas/ClientInput'}
        - {type: object, required: [id], properties: {id: {type: string, format: uuid}}}
    DealInput:
      type: object
      required: [clientId, title, stage]
      properties:
        clientId: {type: string, format: uuid}
        title: {type: string, minLength: 1}
        stage: {type: string, enum: [NEW, IN_PROGRESS, WON, LOST]}
        amountMinor: {type: integer, minimum: 0}
    Deal:
      allOf:
        - {$ref: '#/components/schemas/DealInput'}
        - {type: object, properties: {id: {type: string, format: uuid}}}
    TaskInput:
      type: object
      required: [title, assigneeId]
      properties:
        title: {type: string, minLength: 1}
        assigneeId: {type: string, format: uuid}
        clientId: {type: string, format: uuid}
        dueAt: {type: string, format: date-time}
        status: {type: string, enum: [OPEN, DONE, CANCELLED]}
    Task:
      allOf:
        - {$ref: '#/components/schemas/TaskInput'}
        - {type: object, properties: {id: {type: string, format: uuid}}}
    BookingInput:
      type: object
      required: [clientId, employeeId, serviceId, startsAt, endsAt]
      properties:
        clientId: {type: string, format: uuid}
        employeeId: {type: string, format: uuid}
        serviceId: {type: string, format: uuid}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        status: {type: string, enum: [CONFIRMED, CANCELLED]}
    Booking:
      allOf:
        - {$ref: '#/components/schemas/BookingInput'}
        - {type: object, properties: {id: {type: string, format: uuid}}}
    AIProposal:
      type: object
      required: [id, actionType, payload, status]
      properties:
        id: {type: string, format: uuid}
        actionType: {type: string, enum: [CREATE_TASK, CREATE_BOOKING, DRAFT_REPLY]}
        payload: {type: object, additionalProperties: true}
        status: {type: string, enum: [PENDING, CONFIRMED, REJECTED, EXPIRED]}
        expiresAt: {type: string, format: date-time}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
  responses:
    BadRequest: {description: Request invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Not authenticated, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Not permitted; no state mutation, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Not found or not visible, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Booking/state conflict; no conflicting mutation, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
