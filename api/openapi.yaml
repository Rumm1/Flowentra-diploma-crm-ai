components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: One-hour revocable opaque token. Never a client-supplied role or user ID.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource identifier; inaccessible records return 404.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: 'Opaque server-signed cursor bound to actor, filters and limit; expires after 15 minutes.
        Invalid or expired cursor: 400.'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 'Required for business/account creation. Scope: actor + method + route + key, retained
        24 hours. Same body replays original committed result after current authorization and object access
        checks; changed body returns 409. Lost object access returns 404. No plaintext passwords are retained.'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 30
        pattern: ^"v[1-9][0-9]*"$
      description: 'Exactly one strong resource ETag from a GET/create/update response, e.g. "v3". Missing:
        428; stale: 412. Wildcards and lists unsupported.'
  responses:
    Error400:
      description: Malformed JSON/header/query, unsupported fields, or invalid cursor.
      headers:
        X-Request-ID:
          description: Server-generated correlation identifier.
          schema:
            type: string
            format: uuid
        Cache-Control:
          description: Sensitive responses are not stored.
          schema:
            type: string
            enum:
            - no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Malformed JSON/header/query, unsupported fields, or invalid cursor.
            code: invalid_request
            request_id: 00000000-0000-4000-8000-000000000001
    Error401:
      description: Missing, invalid, expired, or revoked bearer session; invalid login credentials.
      headers:
        X-Request-ID:
          description: Server-generated correlation identifier.
          schema:
            type: string
            format: uuid
        Cache-Control:
          description: Sensitive responses are not stored.
          schema:
            type: string
            enum:
            - no-store
        WWW-Authenticate:
          description: Bearer challenge.
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Missing, invalid, expired, or revoked bearer session; invalid login credentials.
            code: unauthenticated
            request_id: 00000000-0000-4000-8000-000000000001
    Error403:
      description: Authenticated actor lacks route or field permission.
      headers:
        X-Request-ID:
          description: Server-generated correlation identifier.
          schema:
            type: string
            format: uuid
        Cache-Control:
          description: Sensitive responses are not stored.
          schema:
            type: string
            enum:
            - no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
