openapi: 3.0.3
info:
  title: Flowentra Core REST API
  version: 0.1.0-design
  description: DESIGN ONLY. No endpoint implementation or deployment is claimed. Single organization per
    deployment; fixed RBAC and record ownership. AI orchestration and external channels are not public
    endpoints in this contract. See docs/Backend_Design.md.
servers:
- url: http://localhost:8080/api/v1
  description: Proposed local development address; no running server implied. HTTPS required outside local
    development.
security:
- bearerAuth: []
tags:
- name: Authentication
  description: Revocable opaque sessions.
- name: Identity
  description: Internal users and fixed roles.
- name: Clients
  description: Shared client contact directory.
- name: Deals
  description: Owned sales opportunities.
- name: Tasks
  description: Owned work items.
- name: Appointments
  description: Single employee appointments.
- name: Reports
  description: Manager/admin summary aggregates.
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Create a session
      description: 'No signup. Generic credential failures do not reveal account existence. Proposed limits:
        5 failed attempts per account+IP per 15 minutes, plus 30 attempts per IP per minute. One-hour
        opaque revocable session; no refresh token.'
      x-roles: []
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Revoke the current session
      description: Revokes only the presented session; returns no body. Repeated use of the revoked token
        returns 401 and does not recreate a session.
      x-roles:
      - admin
      - manager
      - employee
      responses:
        '204':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /auth/me:
    get:
      tags:
      - Authentication
      operationId: currentUser
      summary: Read the current user
      description: Returns current account state; role changes and deactivation revoke sessions.
      x-roles:
      - admin
      - manager
      - employee
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
            ETag:
              description: Strong resource version, for example "v3".
              schema:
                type: string
                minLength: 1
                maxLength: 30
                pattern: ^"v[1-9][0-9]*"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /auth/password:
    put:
      tags:
      - Authentication
      operationId: changePassword
      summary: Change own password
      description: Verify current password; new password must differ and be 12–128 characters. Revoke
        all sessions atomically, including this one. Reauthentication required; retry with revoked token
        returns 401. Never echo passwords.
      x-roles:
      - admin
      - manager
      - employee
      responses:
        '204':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
  /roles:
    get:
      tags:
      - Identity
      operationId: listRoles
      summary: List fixed roles
      description: Admin only. Returns exactly admin, manager, employee. No custom role creation.
      x-roles:
      - admin
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Roles'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /users/directory:
    get:
      tags:
      - Identity
      operationId: listDirectory
      summary: List active assignment targets
      description: All authenticated roles can read only active users id/display_name. This does not grant
        access to their assigned records.
      x-roles:
      - admin
      - manager
      - employee
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryUserPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /users:
    get:
      tags:
      - Identity
      operationId: listUsers
      summary: List internal accounts
      description: Admin only. Includes active and inactive accounts; deterministic cursor pagination.
      x-roles:
      - admin
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      tags:
      - Identity
      operationId: createUser
      summary: Create an internal account
      description: Admin only; unique normalized email. Starts active. Initial password is securely shared
        outside the API by the administrator; no email delivery is implemented.
      x-roles:
      - admin
      responses:
        '201':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
            ETag:
              description: Strong resource version, for example "v3".
              schema:
                type: string
                minLength: 1
                maxLength: 30
                pattern: ^"v[1-9][0-9]*"$
            Location:
              description: Relative URL of the new resource.
              schema:
                type: string
                example: /api/v1/users/00000000-0000-4000-8000-000000000002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
  /users/{id}:
    get:
      tags:
      - Identity
      operationId: getUser
      summary: Read an internal account
      description: Admin only. For own account use /auth/me; for assignment use /users/directory.
      x-roles:
      - admin
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
            ETag:
              description: Strong resource version, for example "v3".
              schema:
                type: string
                minLength: 1
                maxLength: 30
                pattern: ^"v[1-9][0-9]*"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags:
      - Identity
      operationId: updateUser
      summary: Update an internal account
      description: Admin only. Deactivation or role change revokes sessions. Serialize role/deactivation
        changes to prevent removing the last active admin. Email is immutable in this MVP.
      x-roles:
      - admin
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
            ETag:
              description: Strong resource version, for example "v3".
              schema:
                type: string
                minLength: 1
                maxLength: 30
                pattern: ^"v[1-9][0-9]*"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '428':
          $ref: '#/components/responses/Error428'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
  /clients:
    get:
      tags:
      - Clients
      operationId: listClients
      summary: List clients
      description: 'All roles share the client directory. Authorized filtering happens before pagination.
        Order: created_at DESC, id DESC; not a historical snapshot.'
      x-roles:
      - admin
      - manager
      - employee
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: q
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
        description: Case-insensitive literal substring in display_name; SQL wildcard characters treated
          literally.
      - name: archived
        in: query
        schema:
          type: boolean
          default: false
        description: Select active or archived clients.
    post:
      tags:
      - Clients
      operationId: createClient
      summary: Create client
      description: All roles share the client directory. Creates an active client. Email and phone default
        to null; at least a display name is required.
      x-roles:
      - admin
      - manager
      - employee
      responses:
        '201':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
            ETag:
              description: Strong resource version, for example "v3".
              schema:
                type: string
                minLength: 1
                maxLength: 30
                pattern: ^"v[1-9][0-9]*"$
            Location:
              description: Relative URL of the new resource.
              schema:
                type: string
                example: /api/v1/clients/00000000-0000-4000-8000-000000000002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
            example:
              display_name: Example Repair Ltd
              email: contact@example.com
              phone: '+77010000000'
  /clients/{id}:
    get:
      tags:
      - Clients
      operationId: getClient
      summary: Read client
      description: All roles share the client directory. Missing and inaccessible records both return
        404.
      x-roles:
      - admin
      - manager
      - employee
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
            ETag:
              description: Strong resource version, for example "v3".
              schema:
                type: string
                minLength: 1
                maxLength: 30
                pattern: ^"v[1-9][0-9]*"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags:
      - Clients
      operationId: updateClient
      summary: Update client
      description: 'All roles share the client directory. All roles may edit contact fields. Only admin/manager
        may submit archived. Archiving preserves linked history; it blocks new records linked to the client.
        Existing work can be completed/cancelled; restoration does not restore cancelled appointments.
        PATCH uses a partial object: omitted fields are unchanged; null is permitted only where the schema
        says so.'
      x-roles:
      - admin
      - manager
      - employee
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
            ETag:
              description: Strong resource version, for example "v3".
              schema:
                type: string
                minLength: 1
                maxLength: 30
                pattern: ^"v[1-9][0-9]*"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '428':
          $ref: '#/components/responses/Error428'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdate'
  /deals:
    get:
      tags:
      - Deals
      operationId: listDeals
      summary: List deals
      description: 'Employees see only deals with owner_id equal to their actor ID; admin/manager see
        all. Authorized filtering happens before pagination. Order: created_at DESC, id DESC; not a historical
        snapshot.'
      x-roles:
      - admin
      - manager
      - employee
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: stage
        in: query
        schema:
          type: string
          enum:
          - new
          - qualified
          - won
          - lost
    post:
      tags:
      - Deals
      operationId: createDeal
      summary: Create deal
      description: Employees see only deals with owner_id equal to their actor ID; admin/manager see all.
        Employee owner_id must be self; admin/manager may assign any active user. Client must be active.
        Starts in new stage. Currency must equal the deployment currency.
      x-roles:
      - admin
      - manager
      - employee
      responses:
        '201':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier.
              schema:
                type: string
                format: uuid
            Cache-Control:
              description: Sensitive responses are not stored.
              schema:
                type: string
                enum:
                - no-store
            ETag:
              description: Strong resource version, for example "v3".
              schema:
                type: string
                minLength: 1
                maxLength: 30
                pattern: ^"v[1-9][0-9]*"$
            Location:
              description: Relative URL of the new resource.
              schema:
                type: string
                example: /api/v1/deals/00000000-0000-4000-8000-000000000002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
